[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licensify"
version = "1.1.0"
description = "Official Python client for the LicenseServer licensing platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LicenseServer" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest", "respx"]

[tool.setuptools.packages.find]
include = ["licensify*"]
