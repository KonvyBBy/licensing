<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>License Server — Admin Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236366f1'/%3E%3Cpath d='M7 12l3 3 7-7' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#070b14;--bg2:#0b1120;--surface:#101828;--surface2:#161f35;--border:#1f2a44;--border2:#2b3a5e;
  --text:#e7ecf5;--text2:#93a2c0;--text3:#5d6b8c;
  --accent:#6366f1;--accent2:#8b5cf6;--accent-soft:rgba(99,102,241,.14);
  --green:#34d399;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;
  --radius:14px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;min-height:100vh;line-height:1.45;
  background-image:radial-gradient(1000px 500px at 85% -10%,rgba(99,102,241,.14),transparent 60%),
                   radial-gradient(800px 400px at -10% 0%,rgba(139,92,246,.10),transparent 60%);
  background-attachment:fixed;
}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;font-size:13px;
  padding:9px 14px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
button.ghost:hover{background:var(--surface2);color:var(--text);filter:none}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
button.danger.ghost{background:transparent;color:var(--red);border-color:rgba(248,113,113,.35)}
button.danger.ghost:hover{background:rgba(248,113,113,.08)}
button.small{padding:5px 10px;font-size:12px;border-radius:8px}
button.icon{padding:5px;border-radius:8px;line-height:0}
input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
input::placeholder,textarea::placeholder{color:var(--text3)}
label{display:block;font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);text-transform:none;letter-spacing:0;font-weight:500;margin:0}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#243252;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login ---------- */
.login-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;background:rgba(16,24,40,.75);border:1px solid var(--border);
  border-radius:20px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 18px rgba(99,102,241,.4)}
.login-card h2{font-size:18px;margin:22px 0 4px;letter-spacing:-.2px}
.login-card .sub{color:var(--text2);font-size:13px;margin-bottom:6px}
.login-btn{width:100%;padding:11px;margin-top:20px;font-size:14px}
.field-note{font-size:12px;color:var(--text3);margin-top:14px;text-align:center}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:rgba(10,16,32,.6);border-right:1px solid var(--border);
  padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(10px)}
.sidebar .brand{padding:4px 8px 16px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:8px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:none;color:var(--text2);
  padding:10px 12px;border-radius:10px;font-weight:600;font-size:13.5px;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2);color:var(--text);filter:none}
.nav button.active{background:var(--accent-soft);color:#fff}
.nav button.active svg{color:var(--accent2)}
.nav svg{width:18px;height:18px;flex-shrink:0;color:var(--text3)}
.nav button.active svg{color:var(--accent)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--accent-soft);color:#c7d2fe;margin-left:auto}
.sidebar .foot{border-top:1px solid var(--border);padding:14px 8px 4px}
.sidebar .foot .who{font-size:12.5px;font-weight:600;color:var(--text)}
.sidebar .foot .who small{display:block;color:var(--text3);font-weight:500;font-size:11px}
.sidebar .foot .out{width:100%;margin-top:10px}

.main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.topbar .crumb{color:var(--text3);font-size:12.5px;margin-top:2px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h2{font-size:16px;font-weight:700}

/* ---------- cards & grids ---------- */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  display:flex;gap:14px;align-items:flex-start;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--border2);transform:translateY(-1px)}
.stat .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat .ic svg{width:20px;height:20px}
.stat .ic.blue{background:rgba(96,165,250,.12);color:var(--blue)}
.stat .ic.violet{background:var(--accent-soft);color:var(--accent2)}
.stat .ic.green{background:rgba(52,211,153,.12);color:var(--green)}
.stat .ic.amber{background:rgba(251,191,36,.12);color:var(--amber)}
.stat .lab{font-size:12px;color:var(--text2);font-weight:600}
.stat .num{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:16px}
.card .card-title{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .card-sub{font-size:12.5px;color:var(--text2);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.grow>*{flex:1;min-width:140px}
.space{justify-content:space-between}
.muted{color:var(--text2);font-size:12.5px}
.tiny{color:var(--text3);font-size:11.5px}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
tbody td{padding:12px;border-bottom:1px solid rgba(31,42,68,.6);vertical-align:middle;color:var(--text)}
tbody tr{transition:background .1s}
tbody tr:hover{background:rgba(22,31,53,.55)}
tbody tr:last-child td{border-bottom:none}
.empty{padding:34px;text-align:center;color:var(--text3)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.8}
.empty p{font-size:13.5px}
.mono{font-family:Consolas,'SF Mono',monospace;font-size:12px;background:rgba(11,18,34,.7);border:1px solid var(--border);
  border-radius:6px;padding:2px 7px;word-break:break-all;color:#c7d2fe}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.active,.badge.live,.badge.ok{background:rgba(52,211,153,.1);color:var(--green)}
.badge.disabled,.badge.revoked,.badge.expired{background:rgba(148,163,184,.1);color:var(--text2)}
.badge.banned{background:rgba(248,113,113,.12);color:var(--red)}
.badge.bound{background:rgba(139,92,246,.12);color:var(--accent2)}

/* ---------- code ---------- */
.code-head{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);
  border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;padding:8px 14px}
.code-head .lang{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.4px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--text3);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600}
.tabs button:hover{color:var(--text);filter:none;background:var(--surface2)}
.tabs button.active{background:var(--accent-soft);color:#fff}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:16px;overflow:auto;
  font-size:12.5px;font-family:Consolas,'SF Mono',monospace;line-height:1.6;color:#c7d2fe;max-height:440px}
pre .cm{color:#5d6b8c}
pre .k{color:#c084fc}
pre .s{color:#6ee7b7}
pre .n{color:#fbbf24}
pre .f{color:#7dd3fc}

/* ---------- forms / misc ---------- */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:transparent;color:var(--text2);padding:6px 12px;font-size:12.5px;border-radius:8px}
.seg button.active{background:var(--accent-soft);color:#fff}
.search{display:flex;gap:8px;flex:1;min-width:220px}
.search input{flex:1}
.hint{font-size:12px;color:var(--text2)}
.errline{display:none;margin-top:10px;padding:11px 14px;border-radius:10px;font-size:13px;background:rgba(248,113,113,.1);color:#fca5a5}
.okline{display:none;margin-top:10px;padding:11px 14px;border-radius:10px;font-size:13px;background:rgba(52,211,153,.1);color:#86efac}
.secret-box{display:flex;gap:8px;align-items:center}
.secret-box .mono{flex:1;padding:8px 10px}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text3)}
.kv dd{color:var(--text);word-break:break-all}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:18px;right:18px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;
  animation:slide .25s ease}
.toast.ok{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast .tmsg{flex:1;word-break:break-word}
.toast .tmsg b{display:block;margin-bottom:2px}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- modal ---------- */
.modal-veil{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(4px);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:var(--shadow)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:6px}
.modal p{color:var(--text2);font-size:13.5px}
.modal .row{margin-top:20px;justify-content:flex-end}

@media (max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:10px;overflow-x:auto}
  .sidebar .brand{flex-shrink:0}
  .nav{flex-direction:row;margin:0;flex:none}
  .sidebar .foot{display:none}
  .main{padding:20px 16px 50px}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-stage" id="loginView">
  <div class="login-card">
    <div class="brand"><span class="mark">&#10003;</span> License Server</div>
    <h2>Admin sign in</h2>
    <p class="sub">Manage your licenses, keys and devices.</p>
    <label>Email</label>
    <input id="login-email" type="email" autocomplete="username" style="width:100%" />
    <label>Password</label>
    <input id="login-password" type="password" autocomplete="current-password" style="width:100%" />
    <button class="login-btn" id="login-btn">Sign in</button>
    <p class="field-note">Protected by rate limiting and account lockout.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="shell hidden" id="appView">
  <aside class="sidebar">
    <div class="brand"><span class="mark">&#10003;</span> License Server</div>
    <div class="nav" id="nav">
      <button data-tab="overview" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
        Overview
      </button>
      <button data-tab="apps">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h7v7h-7z" opacity=".4"/></svg>
        Applications
      </button>
      <button data-tab="licenses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
        Licenses
      </button>
      <button data-tab="sessions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        Sessions
      </button>
      <button data-tab="developer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6M13 4l-2 16"/></svg>
        Developer
      </button>
      <button data-tab="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Audit log
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h.1a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v.1a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        Settings
      </button>
    </div>
    <div class="foot">
      <div class="who" id="whoami">admin</div>
      <button class="ghost out" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Overview</h1>
        <div class="crumb" id="page-crumb">License Server / Overview</div>
      </div>
    </div>

    <div id="view-overview"></div>
    <div id="view-apps" class="hidden"></div>
    <div id="view-licenses" class="hidden"></div>
    <div id="view-sessions" class="hidden"></div>
    <div id="view-developer" class="hidden"></div>
    <div id="view-audit" class="hidden"></div>
    <div id="view-settings" class="hidden"></div>
  </main>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
