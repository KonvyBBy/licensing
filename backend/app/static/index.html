<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>License Server — Admin</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#4f46e5;--accent2:#4338ca;--red:#ef4444;--green:#22c55e;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.hidden{display:none!important}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;font-family:inherit;background:var(--accent);color:#fff}
button:hover{background:var(--accent2)}
button.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
button.danger{background:var(--red)}
button.danger:hover{background:#dc2626}
button.small{padding:4px 10px;font-size:12px}
input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-size:12px;color:var(--text2);font-weight:600;margin:10px 0 4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
h1{font-size:18px}
h2{font-size:14px;margin-bottom:10px}
.muted{color:var(--text2);font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
code{background:#0b1220;border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px;word-break:break-all;font-family:Consolas,monospace}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.b-active,.b-ok{background:#052e16;color:var(--green)}
.b-disabled,.b-revoked{background:#1e293b;color:var(--text2)}
.b-banned{background:#450a0a;color:var(--red)}
.b-expired{background:#451a03;color:var(--amber)}
.msg{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.msg.error{background:#450a0a;color:#fca5a5}
.msg.ok{background:#052e16;color:#86efac}
.nav{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.nav button{background:transparent;color:var(--text2);border-bottom:2px solid transparent;border-radius:0;padding:8px 12px}
.nav button.active{color:#fff;border-bottom-color:var(--accent)}
.login-wrap{max-width:360px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px}
pre{background:#0b1220;border-radius:8px;padding:12px;overflow:auto;font-size:12px;font-family:Consolas,monospace;color:#a5b4fc}
</style>
</head>
<body>
<div class="login-wrap" id="loginView">
  <h1>License Server</h1>
  <p class="muted" style="margin-bottom:8px">Admin sign in</p>
  <label>Email</label><input id="login-email" type="email" autocomplete="username" />
  <label>Password</label><input id="login-password" type="password" autocomplete="current-password" />
  <button style="width:100%;margin-top:16px" id="login-btn">Sign in</button>
  <div class="msg error" id="login-err"></div>
</div>

<div id="appView" class="hidden" style="max-width:1000px;margin:0 auto;padding:24px">
  <div class="row space">
    <h1>License Server</h1>
    <div class="row">
      <span class="muted" id="whoami"></span>
      <button class="ghost small" id="logout-btn">Sign out</button>
    </div>
  </div>
  <div class="nav">
    <button data-tab="stats" class="active">Overview</button>
    <button data-tab="apps">Applications</button>
    <button data-tab="licenses">Licenses</button>
    <button data-tab="sessions">Sessions</button>
    <button data-tab="audit">Audit log</button>
  </div>
  <div id="view-stats"></div>
  <div id="view-apps" class="hidden"></div>
  <div id="view-licenses" class="hidden"></div>
  <div id="view-sessions" class="hidden"></div>
  <div id="view-audit" class="hidden"></div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
